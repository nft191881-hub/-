<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聚合收银台演示沙盒</title>
    <style>
        :root { --main-color: #FFC300; --btn-text: #000; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f7f7; margin: 0; padding: 15px; color: #333; }
        .skin-bar { background: #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; }
        .skin-bar select { padding: 4px 8px; margin-left: 5px; }
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .price-box { text-align: center; padding: 20px 0; }
        .price-box h1 { font-size: 32px; margin: 10px 0; color: #fa5151; }
        .btn { background-color: var(--main-color); color: var(--btn-text); width: 100%; padding: 14px; border: none; border-radius: 24px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px; }
        .tip { background: #fffbe6; border: 1px solid #ffe58f; padding: 10px; border-radius: 6px; font-size: 13px; color: #fa8c16; margin-bottom: 15px; }
        /* 模拟弹窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 85%; max-width: 320px; padding: 20px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body id="body" style="--main-color: #FFC300; --btn-text: #000;">

    <!-- 顶端切换控制（模拟后台配置或参数控制） -->
    <div class="skin-bar">
        <span>当前模拟平台：</span>
        <select id="skinSelect" onchange="changeSkin(this.value)">
            <option value="meituan">美团外卖（好友代付）</option>
            <option value="dewu">得物商城（快捷收银）</option>
            <option value="taobao">淘宝好物（代付收银台）</option>
        </select>
    </div>

    <!-- 支付核心区域 -->
    <div class="card price-box">
        <div id="shopName" style="font-size: 14px; color: #666;">美团外卖 · 官方安全支付</div>
        <p style="margin: 10px 0 0; font-size: 13px;">需付款</p>
        <h1>¥ 1.00</h1>
        <div style="font-size: 12px; color: #999;">支付剩余时间 <span id="timer">14:59</span></div>
    </div>

    <div class="tip" id="noticeText">
        1. 代付订单创建成功后15分钟内未付款，订单会自动取消。<br>2. 当代付订单退款成功后，实付款金额将原路退还代付人。
    </div>

    <div class="card">
        <div style="font-weight: bold; margin-bottom: 10px;">订单摘要</div>
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <span>测试商品 x 1</span>
            <span style="font-weight: bold;">¥ 1.00</span>
        </div>
    </div>

    <button class="btn" id="payBtn" onclick="simulatePay()">为好友买单</button>

    <!-- 模拟支付成功或提示弹窗 -->
    <div class="modal" id="payModal">
        <div class="modal-content">
            <h3>⚠️ 演示拦截提示</h3>
            <p id="modalMsg" style="font-size: 14px; color: #666; text-align: left;"></p>
            <button class="btn" onclick="closeModal()" style="margin-top: 15px; padding: 8px;">我知道了</button>
        </div>
    </div>

    <script>
        function changeSkin(skin) {
            const body = document.getElementById('body');
            const shopName = document.getElementById('shopName');
            const noticeText = document.getElementById('noticeText');
            const payBtn = document.getElementById('payBtn');

            if (skin === 'meituan') {
                body.style.setProperty('--main-color', '#FFC300');
                body.style.setProperty('--btn-text', '#000');
                shopName.innerText = '美团外卖 · 好友代付';
                noticeText.innerHTML = '1. 代付订单创建成功后15分钟内未付款。<br>2. 实付款金额将原路退还代付人。';
                payBtn.innerText = '为好友买单';
            } else if (skin === 'dewu') {
                body.style.setProperty('--main-color', '#000000');
                body.style.setProperty('--btn-text', '#ffffff');
                shopName.innerText = '得物 APP · 极速收银台';
                noticeText.innerHTML = '1. 认证安全交易，由第三方担保支付。<br>2. 极速发货，不支持无理由退货。';
                payBtn.innerText = '确认支付 ¥1.00';
            } else if (skin === 'taobao') {
                body.style.setProperty('--main-color', '#FF5000');
                body.style.setProperty('--btn-text', '#ffffff');
                shopName.innerText = '淘宝好物 · 找人代付';
                noticeText.innerHTML = '1. 朋友代付：请确认对方身份再付款。<br>2. 交易产生纠纷由买卖双方协商。';
                payBtn.innerText = '找Ta代付';
            }
        }

        function simulatePay() {
            const modal = document.getElementById('payModal');
            const modalMsg = document.getElementById('modalMsg');
            const skin = document.getElementById('skinSelect').value;
            
            modalMsg.innerHTML = `您当前点击了<b>${skin}</b>模板的支付按钮。<br><br><b>前端逻辑说明：</b>此处不需要后端，完全可以由前端直接弹起密码框、跳转到模拟账单，用来直观展示“页面UI可随意切换，但底层收款方不一致”的防骗核心。`;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
        }
    </script>
</body>
</html>
